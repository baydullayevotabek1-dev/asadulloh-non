# Netlify sozlamalari — Asadulloh Non sayti
# Statik sayt: build qilish shart emas, fayllar ildizda turadi.

[build]
  publish = "."
  command = ""

# Rasmlar uzoq muddat keshlanadi (tez ochilishi uchun)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML har safar yangilanadi (o'zgarish darhol ko'rinishi uchun)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Xavfsizlik header'lari
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
